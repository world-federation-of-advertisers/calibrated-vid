syntax = "proto3";

package calibrated_vid;

// A compact synthetic experiment with campaign-owned event groups.
//
// The shape is intentionally similar to ImpressionTestDataConfig in
// cross-media-measurement, but it adds the latent population and shared
// fingerprint concepts needed for this calibration example.
message SyntheticCampaignExperiment {
  // Controls which true cross-publisher overlaps are observable as matching
  // fingerprints.
  message FingerprintObservationModel {
    double publisher_a_coverage = 1;
    double publisher_b_coverage = 2;

    // Probability that the fingerprints agree when the same person has a
    // fingerprint at both publishers.
    double conditional_match_probability = 3;
  }

  message PublisherEventGroup {
    string publisher = 1;
    double reach_probability = 2;
  }

  // A population whose members have a characteristic probability of being
  // reached by both publishers in the same campaign.
  message VirtualPopulation {
    string name = 1;
    uint64 population_size = 2;
    repeated PublisherEventGroup event_groups = 3;

    // Expected true overlap divided by the smaller publisher reach.
    double overlap_rate_of_smaller_reach = 4;

    reserved 5;

    // Campaign-to-campaign standard deviation for the true overlap rate.
    double campaign_overlap_standard_deviation = 6;
  }

  enum Split {
    SPLIT_UNSPECIFIED = 0;
    TRAIN = 1;
    EVALUATION = 2;
  }

  message CampaignCohort {
    string objective = 1;
    string population = 2;
    Split split = 3;
    uint32 campaign_count = 4;
  }

  uint64 random_seed = 1;
  repeated VirtualPopulation populations = 2;
  repeated CampaignCohort campaign_cohorts = 3;
  FingerprintObservationModel fingerprint_observation_model = 4;
}

// Parameters for the fixed and fingerprint-aware overlap models.
//
// `base_overlap_rate` is the normal overlap learned from Reach campaigns.
// `reference_sensitivity` adjusts that baseline when a campaign's
// coverage-corrected fingerprint overlap differs from the baseline.
message CalibratedVidModel {
  double base_overlap_rate = 1;
  double reference_overlap_center = 2;
  double reference_sensitivity = 3;
}
