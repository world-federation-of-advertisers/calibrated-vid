[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-id-calibration-sim"
version = "0.1.0"
description = "Synthetic validation of Reference-ID union-reach calibration and stored-result reconciliation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.0",
  "jupyterlab>=4.0",
  "nbconvert>=7.0",
  "nbformat>=5.0",
]

[project.scripts]
reference-calibration-sim = "reference_calibration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
